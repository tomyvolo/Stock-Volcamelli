events {}

http {
    # Cada pedido deja una línea con su track_id, a qué instancia fue, el código y cuánto tardó.
    log_format inventario '$time_local track_id=$http_x_track_id instancia=$upstream_addr '
                          'status=$status tiempo=$request_time "$request"';
    access_log /var/log/nginx/access.log inventario;

    # Este grupo contiene las dos instancias de Inventario. Por defecto usa round robin.
    # Si una falla 3 veces en 30 segundos, NGINX deja de mandarle pedidos por 30 segundos.
    upstream inventario {
        server inventario1:8082 max_fails=3 fail_timeout=30s;
        server inventario2:8082 max_fails=3 fail_timeout=30s;
        # Mantiene hasta 32 conexiones abiertas con las instancias para no abrir una por pedido.
        keepalive 32;
    }

    server {
        # El gateway llega por el puerto 80 interno; desde afuera no se ve.
        listen 80;

        location / {
            proxy_pass http://inventario;
            # Si una instancia no conecta en 1 segundo, NGINX prueba la otra y lo cuenta como falla.
            # Tiene que ser menor que los 2 segundos del gateway; si no, el gateway corta antes.
            proxy_connect_timeout 1s;
            # Sin estas dos líneas NGINX cierra la conexión en cada pedido y keepalive no sirve.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
