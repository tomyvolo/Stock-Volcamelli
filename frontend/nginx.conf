server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El navegador manda las cookies de otros proyectos que corrieron en localhost y con el
    # límite de siempre NGINX corta con 400. Nosotros no usamos cookies, solo dejamos más lugar.
    large_client_header_buffers 4 32k;

    # Tiempo Real: la conexión queda abierta y cada aviso tiene que llegar en el momento, así que sin buffer.
    location /api/events {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # El resto de la API. El asistente puede tardar hasta 30 segundos en responder.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
