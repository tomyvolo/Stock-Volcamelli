# Prometheus consulta el /metrics de cada servicio cada cinco segundos.
global:
  scrape_interval: 5s

scrape_configs:
  # Los nombres de los targets son los nombres de los servicios en docker-compose.yml.
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  - job_name: usuarios
    static_configs:
      - targets: ["usuarios:8081"]
    metrics_path: /metrics

  - job_name: sucursales
    static_configs:
      - targets: ["sucursales:8083"]
    metrics_path: /metrics

  - job_name: transferencias
    static_configs:
      - targets: ["transferencias:8084"]
    metrics_path: /metrics

  - job_name: tiempo-real
    static_configs:
      - targets: ["tiempo-real:8085"]
    metrics_path: /metrics

  - job_name: mcp
    static_configs:
      - targets: ["mcp:8086"]
    metrics_path: /metrics

  - job_name: asistente
    static_configs:
      - targets: ["asistente:8087"]
    metrics_path: /metrics

  # Las dos instancias van en el mismo job; Prometheus las distingue con la etiqueta "instance".
  - job_name: inventario
    static_configs:
      - targets: ["inventario1:8082", "inventario2:8082"]
    metrics_path: /metrics
